<section class="forgot-page">
  <main class="forgot-card" aria-label="Formulaire mot de passe oublie">
    <h1>Mot de passe oublie</h1>
    <p>
      Entrez votre email pour recevoir un lien de reinitialisation. Vous serez redirige vers la page
      de connexion apres soumission.
    </p>

    <form [formGroup]="forgotForm" (ngSubmit)="submit()" novalidate>
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="exemple@enicarthage.rnu.tn"
        autocomplete="email"
        [class.field-invalid]="emailControl.invalid && isSubmitted()"
      />
      @if (emailControl.invalid && isSubmitted()) {
        <p class="error-text">Veuillez saisir un email valide.</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Envoi en cours...' : 'Envoyer le lien de reinitialisation' }}
      </button>
    </form>

    <a routerLink="/login">Retour a la connexion</a>
  </main>
</section>
