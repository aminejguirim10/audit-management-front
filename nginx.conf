server {
    # Port d'écoute HTTP
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;

    index index.html;

    gzip on;

    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Ignore les fichiers trop petits, la compression serait contre-productive
    gzip_min_length 1024;

    # Cache 1 an pour les assets, sécurisé car Angular hashe les noms de fichiers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback : redirige vers index.html si le fichier n'existe pas (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pas de cache sur index.html pour que les nouveaux déploiements soient appliqués immédiatement
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}